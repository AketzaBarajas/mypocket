<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#09090B" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F6F6F7" media="(prefers-color-scheme: light)" />
    <meta
      name="description"
      content="Finanzas personales privadas, cifradas de extremo a extremo."
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MyPocket" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>MyPocket</title>
    <!-- Pantalla de arranque: se pinta con el HTML, antes de descargar el JS. -->
    <style>
      html {
        background: #09090b;
        color-scheme: dark light;
      }
      body {
        margin: 0;
      }
      .boot {
        display: flex;
        min-height: 100dvh;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 12px;
        font:
          600 20px/1.2 system-ui,
          sans-serif;
        color: #fafafa;
      }
      @media (prefers-color-scheme: light) {
        html {
          background: #f6f6f7;
        }
        .boot {
          color: #09090b;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Abriendo MyPocket">
        <svg viewBox="0 0 64 64" width="56" height="56" aria-hidden="true">
          <rect width="64" height="64" rx="14" fill="#09090B" />
          <path
            d="M18 24a6 6 0 0 1 6-6h16a6 6 0 0 1 6 6v8a14 14 0 0 1-28 0z"
            fill="none"
            stroke="#3DF5A7"
            stroke-width="5"
            stroke-linejoin="round"
          />
          <path
            d="M26 28l6 6 6-6"
            fill="none"
            stroke="#3DF5A7"
            stroke-width="5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <span>MyPocket</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
